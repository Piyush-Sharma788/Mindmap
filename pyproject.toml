[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mindmap-engine"
version = "0.1.0"
description = "Mini mindmap engine: generate a mindmap from text, grow it with a second document."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "typer>=0.12",
    "anthropic>=2.8,<3",  # lowest version verified (output_config, httpx2-based errors)
    "google-genai>=3.1,<4",  # lowest version verified (response_json_schema, HttpRetryOptions)
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2>=2"]  # tests build SDK error objects with httpx2 directly

[project.scripts]
mindmap = "mindmap.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["tests"]
